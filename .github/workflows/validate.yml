name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install academic-prose dependencies
        run: pip install -r tools/academic-prose/requirements.txt

      - name: Validate academic-prose contract
        working-directory: tools/academic-prose
        run: |
          python3 scripts/validate_skill.py
          python3 -m unittest discover -s tests -v
          (cd scripts && python3 test_internal_register_scan.py)
          (cd scripts && python3 test_process_logic_scan.py)
          (cd scripts && python3 test_vi_ai_pattern_scan.py)

      - name: Validate academic-prose hygiene
        run: |
          python3 tools/academic-prose/scripts/public_hygiene_check.py
          python3 -m py_compile tools/academic-prose/scripts/*.py

      - name: Validate PowerPoint integration
        run: |
          python3 -m unittest discover -s tools/ppt-master-officecli/tests -v
          python3 -m py_compile tools/ppt-master-officecli/scripts/slide_pipeline.py
          bash -n tools/ppt-master-officecli/scripts/install.sh
          test -x tools/ppt-master-officecli/scripts/install.sh
          test -x tools/ppt-master-officecli/scripts/slide_pipeline.py

      - name: Validate ppt-master-officecli hygiene
        run: |
          python3 tools/ppt-master-officecli/scripts/public_hygiene_check.py

      - name: Validate evidence-first-research
        run: |
          python3 tools/evidence-first-research/scripts/public_hygiene_check.py
          python3 -m py_compile tools/evidence-first-research/scripts/*.py

      - name: Validate system-one-work-loop
        run: |
          python3 tools/system-one-work-loop/scripts/public_hygiene_check.py
          python3 -m py_compile tools/system-one-work-loop/scripts/*.py

      - name: Validate evidence-verified-auditing
        run: |
          python3 tools/evidence-verified-auditing/scripts/public_hygiene_check.py
          python3 -m py_compile tools/evidence-verified-auditing/scripts/*.py

      - name: Validate github-pr-workflow
        run: |
          python3 tools/github-pr-workflow/scripts/public_hygiene_check.py
          python3 -m py_compile tools/github-pr-workflow/scripts/*.py

      - name: Validate jev-decision-benchmark
        run: |
          python3 tools/jev-decision-benchmark/scripts/public_hygiene_check.py

      - name: Validate explainer-ladder
        run: |
          python3 tools/explainer-ladder/scripts/public_hygiene_check.py
          python3 -m py_compile tools/explainer-ladder/scripts/*.py

      - name: Validate google-sheets-formatting
        run: |
          python3 tools/google-sheets-formatting/scripts/public_hygiene_check.py
          python3 -m py_compile tools/google-sheets-formatting/scripts/*.py

      - name: Validate ui-ux-pro-max
        run: |
          python3 tools/ui-ux-pro-max/scripts/validate_data.py
          python3 tools/ui-ux-pro-max/scripts/public_hygiene_check.py
          python3 -m py_compile tools/ui-ux-pro-max/scripts/*.py

      - name: Validate web-toolkit
        run: |
          python3 tools/web-toolkit/scripts/public_hygiene_check.py
          python3 -m py_compile tools/web-toolkit/src/*.py tools/web-toolkit/scripts/*.py
          pip install pytest
          python3 -m pytest tools/web-toolkit/tests/test_web_toolkit.py -q

      - name: Validate jev-form-driver
        run: |
          python3 tools/jev-form-driver/scripts/public_hygiene_check.py
          python3 -m py_compile tools/jev-form-driver/src/*.py tools/jev-form-driver/tests/*.py tools/jev-form-driver/scripts/*.py

      - name: Validate vietnamese-classical-literature-research
        # Workflow-injection review (this step triggered the repo's Actions
        # security check): every command below is a static literal path. There is
        # no ${{ }} expression anywhere in this step, and none of the risky
        # contexts (event issue/PR/comment bodies, head_ref, commit message or
        # author, client_payload) is read. Nothing attacker-controlled can reach
        # a shell, so the check is a false positive on file type, documented here
        # as the guidance requires.
        run: |
          # Generated references must still match the evidence table they are
          # built from; a hand edit that breaks this link is the drift the test
          # exists to catch.
          python3 tools/vietnamese-classical-literature-research/scripts/build_glossary.py --check
          python3 tools/vietnamese-classical-literature-research/scripts/public_hygiene_check.py
          python3 -m py_compile tools/vietnamese-classical-literature-research/scripts/*.py tools/vietnamese-classical-literature-research/tests/*.py
          python3 -m unittest discover -s tools/vietnamese-classical-literature-research/tests -v

      - name: Validate code-review-gates
        # Static literal paths only; no ${{ }} expressions, no attacker-controlled
        # input reaches a shell. Same pattern as the steps above.
        run: |
          python3 tools/code-review-gates/scripts/public_hygiene_check.py
          python3 -m py_compile tools/code-review-gates/scripts/*.py
          python3 -m unittest discover -s tools/code-review-gates/tests -v
