name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate academic-prose contract
        working-directory: tools/academic-prose
        run: |
          python3 scripts/validate_skill.py
          python3 -m unittest discover -s tests -v
          (cd scripts && python3 test_internal_register_scan.py)
          (cd scripts && python3 test_process_logic_scan.py)
          (cd scripts && python3 test_vi_ai_pattern_scan.py)

      - name: Validate PowerPoint integration
        run: |
          python3 -m unittest discover -s tools/ppt-master-officecli/tests -v
          python3 -m py_compile tools/ppt-master-officecli/scripts/slide_pipeline.py
          bash -n tools/ppt-master-officecli/scripts/install.sh
          test -x tools/ppt-master-officecli/scripts/install.sh
          test -x tools/ppt-master-officecli/scripts/slide_pipeline.py
